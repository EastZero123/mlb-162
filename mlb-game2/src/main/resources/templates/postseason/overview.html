<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{postseason.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container" th:with="myTeam=${player.team.id}">
    <h1 class="page-title" th:text="#{postseason.heading(${postseason.seasonYear})}">2026 포스트시즌</h1>
    <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <!-- 상태 -->
    <section class="card section">
        <p th:if="${!postseason.userTeamQualified}"
           th:utext="#{postseason.missed(${#strings.escapeXml(player.team.displayName)})}">
            <strong>팀</strong>은(는) 포스트시즌 진출에 실패했습니다. 다른 팀들의 결과만 확인할 수 있어요.
        </p>
        <p th:if="${postseason.userTeamQualified and !postseason.userPlays}"
           th:utext="#{postseason.qualifiedNotPlaying(${#strings.escapeXml(player.team.displayName)})}">
            <strong>팀</strong>이(가) 진출했지만, 내 선수는 메이저 로스터가 아니거나 부상이라 출전하지 않습니다.
        </p>
        <p th:if="${postseason.userPlays}"
           th:utext="#{postseason.playing(${#strings.escapeXml(player.team.displayName)})}">
            <strong>팀</strong>이(가) 포스트시즌에 진출했습니다! 라운드마다 직접 경기에 나섭니다.
        </p>
        <div class="award-banner" th:if="${postseason.done and postseason.championTeamId != null}"
             th:classappend="${postseason.championTeamId == myTeam} ? 'celebrate'">
            <span class="award-icon">🏆</span>
            <strong th:text="#{postseason.champion(${teams[postseason.championTeamId].displayName})}">우승</strong>
            <span th:if="${postseason.championTeamId == myTeam}" th:text="#{postseason.myTeamWon}">내 팀이 정상에 올랐습니다!</span>
        </div>
        <div class="award-banner celebrate" th:each="aw : ${awards}">
            <span class="award-icon">🏅</span>
            <strong th:text="${aw.title}">MVP</strong>
            <span th:text="#{award.reward(${aw.points}, ${@fmt.money(aw.bonus)})}">+2</span>
        </div>
        <form th:if="${nextRound != null}" th:action="@{/players/{id}/postseason/play(id=${player.id})}" method="post">
            <button type="submit" class="btn btn-primary" th:text="#{postseason.playRound(${nextRound.label})}">와일드카드 시리즈 진행</button>
        </form>
    </section>

    <!-- 대진 -->
    <section class="card section" th:each="r : ${rounds}" th:if="${!#lists.isEmpty(bracket.round(r.number))}">
        <h2 class="section-title" th:text="#{postseason.round(${r.label}, ${r.winsNeeded()})}">와일드카드</h2>
        <div class="bracket-grid">
            <div class="bracket-series" th:each="s : ${bracket.round(r.number)}"
                 th:classappend="${s.userTeam} ? 'my-series'">
                <small class="muted" th:text="${s.league == 'WS'} ? #{postseason.ws} : (${s.league == 'AL'} ? #{league.al} : #{league.nl})">AL</small>
                <div class="bracket-row" th:classappend="${s.winnerId != null and s.winnerId == s.highTeamId} ? 'winner'">
                    <span th:text="${s.highSeed} + '. ' + ${teams[s.highTeamId].displayName}">1. 팀</span>
                    <strong th:text="${s.highWins}">0</strong>
                </div>
                <div class="bracket-row" th:classappend="${s.winnerId != null and s.winnerId == s.lowTeamId} ? 'winner'">
                    <span th:text="${s.lowSeed} + '. ' + ${teams[s.lowTeamId].displayName}">4. 팀</span>
                    <strong th:text="${s.lowWins}">0</strong>
                </div>
                <small class="muted" th:unless="${#lists.isEmpty(s.scores)}"
                       th:text="${#strings.listJoin(s.scores, ' · ')}">5-3 · 2-4</small>
                <small th:if="${s.userSummary != null}" th:text="#{postseason.myLine(${s.userSummary})}">내 기록</small>
                <small class="muted" th:if="${s.winnerId == null}" th:text="#{postseason.notPlayed}">진행 전</small>
            </div>
        </div>
    </section>

    <!-- 내 포스트시즌 기록 -->
    <section class="card section" th:if="${postseason.userPlays}">
        <h2 class="section-title" th:text="#{postseason.myRecord}">내 포스트시즌 기록</h2>
        <p th:unless="${player.pitcher}" th:text="${batting.summary()} + ' · OPS ' + ${@fmt.rate(batting.ops)}">기록</p>
        <p th:if="${player.pitcher}" th:text="#{line.games(${pitching.games}, ${pitching.summary()})} + ' · ERA ' + ${@fmt.two(pitching.era)}">기록</p>
    </section>

    <div class="actions">
        <a class="btn btn-ghost" th:href="@{/players/{id}/season(id=${player.id})}" th:text="#{nav.toSeasonScreen}">시즌 화면으로</a>
        <a class="btn btn-ghost" th:href="@{/players/{id}/league(id=${player.id})}" th:text="#{nav.league}">리그 현황</a>
    </div>
</main>
</body>
</html>
