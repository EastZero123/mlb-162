plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mlbgame'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 사용자 폴더 이름에 한글이 있으면 Mockito 에이전트가 붙지 못해 테스트가 실패하므로 임시 폴더를 프로젝트 안으로
tasks.withType(Test).configureEach {
    def tmp = layout.buildDirectory.dir('tmp/test-jvm').get().asFile
    doFirst { tmp.mkdirs() }
    systemProperty 'java.io.tmpdir', tmp.absolutePath
    environment 'TMP', tmp.absolutePath
    environment 'TEMP', tmp.absolutePath
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'balance', 'career'   // 오래 걸리는 밸런스 검증은 balanceTest·careerTest 로 분리
    }
}

// 0.0.2 패치(버그 수정·기록 개편) 검증 테스트만 실행: gradlew bugfixTest (일반 test 에도 포함된다)
tasks.register('bugfixTest', Test) {
    description = '0.0.2 패치: 버그 수정, 부상 회복, 공개 페이지, 레벨·구단별 기록·수비·우승 기록을 검증합니다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'bugfix'
    }
    testLogging {
        events 'passed', 'failed'
        exceptionFormat 'full'
    }
}

// 커리어 전체 자동 진행 밸런스 검증: gradlew careerTest -Pcareers=3 (프로필당 커리어 수, 기본 2)
tasks.register('careerTest', Test) {
    description = '선수 생성부터 은퇴까지 자동으로 진행해 데뷔 시기·수상·연봉·은퇴 나이를 리포트합니다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'careers', findProperty('careers') ?: '2'
    useJUnitPlatform {
        includeTags 'career'
    }
    testLogging {
        showStandardStreams = true
        events 'passed', 'failed'
        exceptionFormat 'full'
    }
}

// 시즌 반복 시뮬레이션 밸런스 검증 (리포트 표를 콘솔에 출력)
tasks.register('balanceTest', Test) {
    description = 'OVR별 시즌 기록 분포가 MLB 기준에 맞는지 검증합니다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'balance'
    }
    testLogging {
        showStandardStreams = true
        events 'passed', 'failed'
        exceptionFormat 'full'
    }
}
