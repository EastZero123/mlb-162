spring:
  application:
    name: mlb-game
  profiles:
    default: local   # DB 접속 정보는 application-local.yml 에 기입
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway 로만 변경
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false

game:
  balance:                     # 설계: docs/player-attributes.md
    max-active-players: 3
    high-school-start: 25      # 고졸 기본 능력치 (11개 모두 동일, 배분 후 평균 30)
    college-start: 35          # 대졸 기본 능력치 (11개 모두 동일, 배분 후 평균 40)
    allocation-points: 55      # 생성 시 자유 배분 포인트 (11개 × 5)
    allocation-max-per-attribute: 25  # 능력치 하나에 넣을 수 있는 최대 포인트
    high-school-scout-bonus: 10  # 컴바인 종합 점수의 고졸 나이 프리미엄
  simulation:                  # 타석 결과 모델. 설계: docs/simulation.md
    baseline-rating: 65        # 이 능력치끼리 만나면 아래 MLB 평균이 나옴
    baseline:                  # MLB 리그 평균 (타석 기준, 2023~2024 근사)
      strikeout-rate: 0.225
      walk-rate: 0.085
      hit-by-pitch-rate: 0.011
      home-run-rate: 0.031
      babip: 0.295
      double-share: 0.23       # 인플레이 안타 중 2루타
      triple-share: 0.02       # 인플레이 안타 중 3루타
      ground-ball-share: 0.45  # 인플레이 아웃 중 땅볼
    kbo-baseline:              # KBO 리그 평균 (2023~2025 근사: 타율 .268 / 출루율 .345 / 장타율 .405). 능력치 계수는 MLB 와 공통
      strikeout-rate: 0.190
      walk-rate: 0.090
      hit-by-pitch-rate: 0.013
      home-run-rate: 0.023
      babip: 0.318              # 타율 .268 이 되도록 (K4)
      double-share: 0.22
      triple-share: 0.015
      ground-ball-share: 0.46
    coefficients:              # 능력치 10 차이당 로그 오즈 변화량 (사건마다 타자 합 = 투수 합)
      strikeout-avoid-k: 0.30      # 타자 0.30 = 투수 0.20 + 0.10
      strikeout-put-away: 0.20
      strikeout-velocity: 0.10
      walk-eye: 0.25               # 타자 0.25 = 투수 0.25
      walk-control: 0.25
      home-run-power: 0.35         # 타자 0.35 = 투수 0.28 + 0.07
      home-run-movement: 0.28
      home-run-velocity: 0.07
      babip-contact: 0.12          # 타자 0.12 + 0.04 = 투수 0.10 + 0.06
      babip-speed: 0.04
      babip-velocity: 0.10
      babip-movement: 0.06
      double-gap-power: 0.20       # 타자 0.20 = 투수 0.20
      double-ground-ball: 0.20
      triple-speed: 0.35
      ground-ball-pitcher: 0.15    # 타자 0.15 = 투수 0.15
      ground-ball-power: 0.15
      platoon-edge: 0.10
      clutch: 0.08

server:
  port: 8080
  servlet:
    context-path: /game   # 메인 주소: http://localhost:8080/game
    session:
      timeout: 2h
  mime-mappings:
    webmanifest: application/manifest+json   # 홈 화면 앱(PWA) manifest
