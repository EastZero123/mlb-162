<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title th:text="${title} + ' | MLB 선수 키우기'">MLB 선수 키우기</title>
    <!-- 홈 화면에 추가하면 주소창 없이 앱처럼 열린다 -->
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <meta name="theme-color" content="#0b3d91" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f141d" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MLB 키우기">
    <meta name="format-detection" content="telephone=no">
    <link rel="apple-touch-icon" th:href="@{/icons/icon-180.png}">
    <link rel="icon" type="image/png" th:href="@{/icons/icon-192.png}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<header th:fragment="header" class="site-header">
    <a class="brand" th:href="@{/dashboard}">⚾ MLB 선수 키우기</a>
    <div class="header-right" sec:authorize="isAuthenticated()"
         xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
        <a class="nav-link" th:href="@{/rankings}">랭킹</a>
        <a class="nav-link" th:href="@{/patch-notes}">패치노트</a>
        <span class="who" sec:authentication="principal.nickname">닉네임</span>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-ghost">로그아웃</button>
        </form>
    </div>
    <div class="header-right" sec:authorize="!isAuthenticated()"
         xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
        <a class="nav-link" th:href="@{/rankings}">랭킹</a>
        <a class="nav-link" th:href="@{/patch-notes}">패치노트</a>
        <a class="btn btn-ghost" th:href="@{/login}">로그인</a>
    </div>
</header>
</body>
</html>
