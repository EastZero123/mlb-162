plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mlbgame'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'balance', 'career'   // 오래 걸리는 밸런스 검증은 balanceTest·careerTest 로 분리
    }
}

// 커리어 전체 자동 진행 밸런스 검증: gradlew careerTest -Pcareers=3 (프로필당 커리어 수, 기본 2)
tasks.register('careerTest', Test) {
    description = '선수 생성부터 은퇴까지 자동으로 진행해 데뷔 시기·수상·연봉·은퇴 나이를 리포트합니다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'careers', findProperty('careers') ?: '2'
    useJUnitPlatform {
        includeTags 'career'
    }
    testLogging {
        showStandardStreams = true
        events 'passed', 'failed'
        exceptionFormat 'full'
    }
}

// 시즌 반복 시뮬레이션 밸런스 검증 (리포트 표를 콘솔에 출력)
tasks.register('balanceTest', Test) {
    description = 'OVR별 시즌 기록 분포가 MLB 기준에 맞는지 검증합니다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'balance'
    }
    testLogging {
        showStandardStreams = true
        events 'passed', 'failed'
        exceptionFormat 'full'
    }
}
