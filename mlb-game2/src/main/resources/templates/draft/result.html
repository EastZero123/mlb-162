<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{draft.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container narrow reveal-all">
    <section class="card draft-card reveal" th:style="'border-top-color:' + ${draft.team.primaryColor}"
             th:classappend="${draft.round == 1} ? 'celebrate'">
        <p class="muted" th:text="#{draft.pick(${draft.round}, ${draft.pickInRound}, ${draft.overallPick})}">
            1라운드 5번 (전체 5순위)
        </p>
        <p class="draft-team" th:style="'color:' + ${draft.team.primaryColor}" th:text="${draft.team.displayName}">팀</p>
        <p class="muted" th:text="${#locale.language == 'en'} ? ${draft.team.league + ' ' + draft.team.division}
                                  : ${draft.team.name + ' · ' + draft.team.league + ' ' + draft.team.division}">팀 영문</p>
        <p class="draft-line" th:utext="#{draft.line(${#strings.escapeXml(player.name)}, ${player.position.label})}">
            <strong>선수</strong>, 유격수로 지명!
        </p>
        <dl class="draft-facts">
            <div>
                <dt th:text="#{draft.signingBonus}">계약금</dt>
                <dd th:text="'$' + ${#numbers.formatInteger(draft.signingBonus, 1, 'COMMA')}">$1,000,000</dd>
            </div>
            <div>
                <dt th:text="#{draft.startTeam}">시작 팀</dt>
                <dd th:text="${player.teamDisplayName}">디트로이트 타이거스 루키</dd>
            </div>
            <div>
                <dt>OVR</dt>
                <dd th:text="${#numbers.formatDecimal(player.overall, 1, 1)}">30.0</dd>
            </div>
        </dl>
        <div class="actions">
            <a class="btn btn-primary" th:href="@{/players/{id}/season(id=${player.id})}" th:text="#{draft.startSeason}">2026 시즌 시작</a>
            <a class="btn btn-ghost" th:href="@{/players/{id}(id=${player.id})}" th:text="#{draft.viewPlayer}">선수 정보 보기</a>
            <a class="btn btn-ghost" th:href="@{/dashboard}" th:text="#{nav.dashboard}">대시보드</a>
        </div>
    </section>
</main>
</body>
</html>
