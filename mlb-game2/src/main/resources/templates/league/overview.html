<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{nav.league})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <h1 class="page-title" th:text="#{league.title(${season.seasonYear})}">2026 메이저리그 현황</h1>
    <p class="muted">
        <span th:text="#{league.progress(${season.seriesPlayed})}">진행</span> ·
        <th:block th:text="#{league.myTeam}">내 소속</th:block> <strong th:text="${@fmt.teamName(player.team, season.leagueLevel)}">팀</strong>
        <span th:if="${season.leagueLevel.name() != 'MLB'}" th:text="#{league.mlbStandingsNote}">(메이저 구단 순위를 표시합니다)</span>
    </p>

    <!-- 순위표 -->
    <div class="league-grid">
        <section class="card section" th:each="lg : ${leagues}">
            <h2 class="section-title" th:text="${lg == 'AL'} ? #{league.al} : #{league.nl}">아메리칸리그</h2>
            <div th:each="dv : ${divisions}" class="division">
                <h3 class="sub-title" th:text="${dv == 'EAST'} ? #{league.east} : (${dv == 'CENTRAL'} ? #{league.central} : #{league.west})">동부</h3>
                <table class="stat-table">
                    <thead><tr><th class="left" th:text="#{league.col.team}">팀</th><th th:text="#{league.col.w}">승</th><th th:text="#{league.col.l}">패</th>
                        <th th:text="#{league.col.pct}">승률</th><th th:text="#{league.col.gb}">승차</th></tr></thead>
                    <tbody>
                    <tr th:each="d : ${table.division(lg, dv)}"
                        th:classappend="${d.row().team().id == myTeamId} ? 'my-team'">
                        <td class="left" th:text="${d.row().team().displayName}">팀</td>
                        <td th:text="${d.row().wins()}">0</td>
                        <td th:text="${d.row().losses()}">0</td>
                        <td th:text="${@fmt.rate(d.row().pct())}">.000</td>
                        <td th:text="${d.gamesBehind() == 0} ? '-' : ${@fmt.one(d.gamesBehind())}">-</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <h3 class="sub-title" th:text="#{league.playoffSeeds}">포스트시즌 진출권 (현재 기준)</h3>
            <ol class="seed-list">
                <li th:each="s : ${table.playoffSeeds(lg)}"
                    th:classappend="${s.row().team().id == myTeamId} ? 'my-team'">
                    <span th:text="${s.row().team().displayName}">팀</span>
                    <small class="muted" th:text="${s.divisionWinner()} ? #{league.divisionWinner} : #{league.wildCard}">지구 1위</small>
                </li>
            </ol>
        </section>
    </div>

    <!-- 리더보드 -->
    <section class="card section">
        <h2 class="section-title" th:text="#{league.leaders}">개인 기록 순위</h2>
        <p class="muted small" th:if="${completedMonths == 0}" th:text="#{league.leaders.firstMonth}">첫 달(9시리즈)이 끝나면 리그 기록이 집계됩니다.</p>
        <p class="muted small" th:unless="${completedMonths == 0}"
           th:text="#{league.leaders.basis(${completedMonths})}">기준</p>
        <div class="leader-grid" th:unless="${completedMonths == 0}">
            <div class="leader-box" th:each="entry : ${leaders}">
                <h3 class="sub-title" th:text="${entry.key.label}">홈런</h3>
                <ol class="leader-list">
                    <li th:each="e : ${entry.value}" th:classappend="${e.candidate().me()} ? 'my-team'">
                        <span class="leader-name">
                            <span th:text="${e.candidate().name()}">선수</span>
                            <small class="muted" th:text="${e.candidate().teamName()}">팀</small>
                        </span>
                        <strong th:text="${entry.key.name() == 'AVG' or entry.key.name() == 'OPS'} ? ${@fmt.rate(e.value())}
                                : (${entry.key.name() == 'ERA'} ? ${@fmt.two(e.value())} : ${#numbers.formatInteger(e.value(), 1)})">0</strong>
                    </li>
                </ol>
            </div>
        </div>
    </section>

    <div class="actions">
        <a class="btn btn-primary" th:href="@{/players/{id}/season(id=${player.id})}" th:text="#{nav.toSeason}">시즌 진행으로</a>
        <a class="btn btn-ghost" th:href="@{/players/{id}/season/stats(id=${player.id})}" th:text="#{league.mySeasonStats}">내 시즌 기록</a>
    </div>
</main>
</body>
</html>
