<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 훈련 선택: 능력치 버튼 11개, 하나를 누르면 +1 -->
<section th:fragment="training(player)" class="card section training-panel">
    <h2 class="section-title">훈련 — 능력치 하나를 골라 훈련</h2>
    <p class="muted small">
        훈련을 골라야 다음 시리즈를 진행할 수 있어요. 능력치가 높을수록(85·90·95), 나이가 많을수록(30·33·36세)
        +1 에 훈련이 여러 번 필요해요.
    </p>
    <form th:action="@{/players/{id}/season/train(id=${player.id})}" method="post" class="train-grid">
        <button type="submit" name="attribute" class="train-btn"
                th:each="a : ${player.attributeViews}"
                th:value="${a.attribute().name()}"
                th:disabled="${a.value() >= 100}"
                th:title="${a.attribute().description}">
            <span class="train-label" th:text="${a.label()}">컨택</span>
            <span class="train-value" th:with="cost=${player.trainingCost(a.attribute())},
                                               progress=${player.trainingProgress(a.attribute())}">
                <span th:text="${a.value()}">40</span>
                <th:block th:if="${a.value() < 100}">
                    <span th:if="${cost - progress == 1}" th:text="'→ ' + ${a.value() + 1}">→ 41</span>
                    <span th:unless="${cost - progress == 1}" class="train-progress"
                          th:text="'훈련 ' + ${progress} + '/' + ${cost}">훈련 1/4</span>
                </th:block>
                <span th:unless="${a.value() < 100}">MAX</span>
            </span>
            <small class="train-desc" th:text="${a.attribute().description}">설명</small>
        </button>
    </form>
</section>

<!-- 스탯업 포인트 사용: 시상으로 받은 포인트 1개 = 능력치 +1 (언제든) -->
<section th:fragment="points(player)" class="card section points-panel">
    <h2 class="section-title">
        스탯업 포인트 <span class="badge badge-win" th:text="${player.statPoints} + '개 보유'">2개 보유</span>
    </h2>
    <p class="muted small">시상으로 받은 포인트예요. 원하는 능력치에 하나씩 쓸 수 있고, 다음 시즌으로 이월돼요.</p>
    <form th:action="@{/players/{id}/season/points(id=${player.id})}" method="post" class="train-grid">
        <button type="submit" name="attribute" class="train-btn"
                th:each="a : ${player.attributeViews}"
                th:value="${a.attribute().name()}"
                th:disabled="${a.value() >= 100}">
            <span class="train-label" th:text="${a.label()}">컨택</span>
            <span class="train-value" th:text="${a.value() < 100} ? ${a.value()} + ' → ' + ${a.value() + 1} : 'MAX'">40 → 41</span>
        </button>
    </form>
</section>

<!-- 선수 상태 카드 -->
<section th:fragment="status(player, season)" class="card section status-card"
         th:style="'border-top-color:' + ${player.team.primaryColor}">
    <div class="status-head">
        <div>
            <div class="slot-no" th:text="${season.seasonYear} + ' 시즌 · ' + ${season.leagueLevel.label}">2026 시즌</div>
            <h1 class="player-name big" th:text="${player.name}">선수</h1>
            <p class="player-meta">
                <strong th:text="${@fmt.teamName(player.team, season.leagueLevel)}">팀</strong> ·
                <span th:text="${player.position.label}">유격수</span> ·
                <span th:text="${player.age} + '세'">22세</span>
            </p>
        </div>
        <div class="ovr big">OVR <strong th:text="${@fmt.one(player.overall)}" th:attr="data-count=${@fmt.one(player.overall)}">40.0</strong></div>
    </div>
    <!-- 시즌 진행 막대: 9시리즈(한 달)마다 눈금 -->
    <div class="season-track" th:title="${season.seriesPlayed} + ' / 54 시리즈'">
        <span class="season-progress-fill" th:style="'width:' + ${season.seriesPlayed * 100 / 54} + '%'"></span>
        <span class="month-tick" th:each="m : ${#numbers.sequence(1, 5)}" th:style="'left:' + ${m * 100 / 6} + '%'"></span>
    </div>
    <div class="month-labels"><span>4월</span><span>5월</span><span>6월</span><span>7월</span><span>8월</span><span>9월</span></div>
    <div class="status-grid">
        <div>
            <span class="muted small">진행</span>
            <strong th:text="${season.seriesPlayed} + ' / 54'">0 / 54</strong>
        </div>
        <div>
            <span class="muted small">팀 성적</span>
            <strong th:text="${season.teamWins} + '승 ' + ${season.teamLosses} + '패'">0승 0패</strong>
        </div>
        <div>
            <span class="muted small">피로도</span>
            <span class="bar"><span class="bar-fill" th:classappend="${season.fatigue > 70} ? 'danger'"
                                    th:style="'width:' + ${season.fatigue} + '%'"></span></span>
            <small th:text="${season.fatigue}">0</small>
        </div>
        <div th:unless="${season.completed}">
            <span class="muted small" th:text="${season.leagueLevel.name() == 'MLB'} ? '다음 잔류 평가' : '다음 승격 평가'">다음 승격 평가</span>
            <strong th:with="left=${9 - season.seriesPlayed % 9}"
                    th:text="${season.seriesPlayed + left >= 54} ? '시즌 종료 후' : ${left} + '시리즈 후'">9시리즈 후</strong>
        </div>
        <div>
            <span class="muted small">스탯업 포인트</span>
            <strong th:text="${player.statPoints} + '개'">0개</strong>
        </div>
        <div>
            <span class="muted small">상태</span>
            <strong th:if="${season.sidelined}" class="danger-text"
                    th:text="'부상 · ' + ${season.injuredSeriesRemaining} + '시리즈 결장'">부상</strong>
            <strong th:unless="${season.sidelined}">정상</strong>
        </div>
    </div>
</section>

</body>
</html>
