<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${player.name})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container narrow">
    <section class="card profile" th:style="${player.team != null} ? 'border-top-color:' + ${player.team.primaryColor}">
        <div class="profile-head">
            <div>
                <div class="slot-no">
                    <span th:text="${player.position.label}">유격수</span> · #<span th:text="${player.uniformNumber}">7</span>
                </div>
                <h1 class="player-name big" th:text="${player.name}">선수 이름</h1>
                <p class="player-meta">
                    <span th:text="${player.education.label}">고졸</span> ·
                    <span th:text="#{common.age(${player.age})}">18세</span> ·
                    <span th:text="${player.handLabel}">우투우타</span>
                </p>
                <p class="player-meta">
                    <span th:text="${player.nationality.label}">미국</span> ·
                    <span th:text="${player.schoolRegion.label}">미국 동부</span>
                    <th:block th:if="${player.team != null}">
                        · <strong th:text="${player.teamDisplayName}">디트로이트 타이거스 A</strong>
                    </th:block>
                </p>
                <p class="player-meta" th:if="${player.team != null}">
                    <th:block th:text="#{player.reputation}">평판</th:block> <strong th:text="${player.reputation}">50</strong>
                    <th:block th:if="${player.noTradeClause}" th:text="' · ' + #{player.noTradeClause}"> · 트레이드 거부권</th:block>
                </p>
            </div>
            <div class="ovr big">OVR <strong th:text="${#numbers.formatDecimal(player.overall, 1, 1)}">30.0</strong></div>
        </div>

        <h2 class="section-title" th:text="#{common.stats}">능력치</h2>
        <ul class="attr-list">
            <li th:each="a : ${player.attributeViews}" th:title="${a.attribute().description}">
                <span class="attr-label">
                    <span th:text="${a.label()}">컨택</span>
                    <small class="attr-desc" th:text="${a.attribute().description}">설명</small>
                </span>
                <span class="bar"><span class="bar-fill" th:style="'width:' + ${a.value()} + '%'"></span></span>
                <span class="attr-value" th:text="${a.value()}">30</span>
            </li>
        </ul>

        <p class="pitch-repertoire" th:if="${player.pitcher}">
            <span class="muted small" th:text="#{common.pitches}">구종</span>
            <span class="chip" th:each="t : ${player.pitchRepertoire}" th:text="${t.label}">포심</span>
        </p>

        <div class="actions">
            <a class="btn btn-ghost" th:href="@{/players/{id}/combine(id=${player.id})}" th:text="#{player.combineRecord}">컴바인 기록</a>
            <a class="btn btn-ghost" th:if="${player.stage.name() == 'DRAFTED'}"
               th:href="@{/players/{id}/draft(id=${player.id})}" th:text="#{player.draftResult}">드래프트 결과</a>
            <a class="btn btn-ghost" th:href="@{/dashboard}" th:text="#{nav.dashboard}">대시보드</a>
        </div>
        <div class="actions" th:if="${player.stage.name() == 'DRAFTED'}">
            <a class="btn btn-primary" th:href="@{/players/{id}/season(id=${player.id})}" th:text="#{dashboard.playSeason}">시즌 진행</a>
            <a class="btn btn-ghost" th:href="@{/players/{id}/season/stats(id=${player.id})}" th:text="#{nav.seasonStats}">시즌 기록</a>
            <a class="btn btn-ghost" th:href="@{/players/{id}/career(id=${player.id})}" th:text="#{nav.career}">커리어</a>
        </div>
    </section>
</main>
</body>
</html>
